[project]
name = "cc-session-search"
version = "0.1.0"
description = "Search and analyze Claude Code conversation history"
requires-python = ">=3.13"
dependencies = [
    "cc-bench-schema",
    "mcp>=1.2.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]

[tool.uv.sources]
cc-bench-schema = { path = "../cc-bench-schema", editable = true }

[project.scripts]
ccsearch = "cc_session_search.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
